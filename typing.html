<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test | Jonathan Chiang</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="typing.css">
</head>
<body>
    <main class="page-container typing-page">
        <!-- Background Gradient -->
        <div class="background-gradient"></div>

        <!-- Home Button -->
        <a href="index.html" class="home-btn" aria-label="Go to home">
            <i class="ph ph-house"></i>
        </a>

        <!-- Typing Test Container -->
        <div class="typing-container">
            <!-- Header -->
            <header class="typing-header">
                <h1 class="typing-title">
                    <i class="ph ph-keyboard"></i>
                    Type Test
                </h1>
            </header>

            <!-- Mode Selection -->
            <div class="mode-selector">
                <div class="mode-group">
                    <button class="mode-btn" data-mode="punctuation" title="Include punctuation">
                        <i class="ph ph-at"></i>
                        <span>punctuation</span>
                    </button>
                    <button class="mode-btn" data-mode="numbers" title="Include numbers">
                        <i class="ph ph-hash"></i>
                        <span>numbers</span>
                    </button>
                </div>
                <div class="mode-divider"></div>
                <div class="mode-group">
                    <button class="mode-btn active" data-type="time" title="Time mode">
                        <i class="ph ph-timer"></i>
                        <span>time</span>
                    </button>
                    <button class="mode-btn" data-type="words" title="Words mode">
                        <i class="ph ph-text-aa"></i>
                        <span>words</span>
                    </button>
                </div>
                <div class="mode-divider"></div>
                <div class="mode-group duration-group">
                    <button class="duration-btn" data-duration="15">15</button>
                    <button class="duration-btn" data-duration="30">30</button>
                    <button class="duration-btn active" data-duration="60">60</button>
                    <button class="duration-btn" data-duration="120">120</button>
                </div>
            </div>

            <!-- Stats Display -->
            <div class="stats-bar">
                <div class="stat" id="timerStat">
                    <span class="stat-value" id="timer">60</span>
                    <span class="stat-label">seconds</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="wpm">0</span>
                    <span class="stat-label">wpm</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="accuracy">100</span>
                    <span class="stat-label">% acc</span>
                </div>
            </div>

            <!-- Text Display -->
            <div class="text-display" id="textDisplay">
                <div class="words" id="words"></div>
                <input type="text" class="typing-input" id="typingInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            </div>

            <!-- 3D Keyboard -->
            <div class="keyboard-container">
                <div class="keyboard" id="keyboard">
                    <!-- Row 1 -->
                    <div class="keyboard-row">
                        <div class="key" data-key="`">`</div>
                        <div class="key" data-key="1">1</div>
                        <div class="key" data-key="2">2</div>
                        <div class="key" data-key="3">3</div>
                        <div class="key" data-key="4">4</div>
                        <div class="key" data-key="5">5</div>
                        <div class="key" data-key="6">6</div>
                        <div class="key" data-key="7">7</div>
                        <div class="key" data-key="8">8</div>
                        <div class="key" data-key="9">9</div>
                        <div class="key" data-key="0">0</div>
                        <div class="key" data-key="-">-</div>
                        <div class="key" data-key="=">=</div>
                        <div class="key key-wide-2" data-key="Backspace">
                            <i class="ph ph-backspace"></i>
                        </div>
                    </div>
                    <!-- Row 2 -->
                    <div class="keyboard-row">
                        <div class="key key-wide-1-5" data-key="Tab">Tab</div>
                        <div class="key" data-key="q">Q</div>
                        <div class="key" data-key="w">W</div>
                        <div class="key" data-key="e">E</div>
                        <div class="key" data-key="r">R</div>
                        <div class="key" data-key="t">T</div>
                        <div class="key" data-key="y">Y</div>
                        <div class="key" data-key="u">U</div>
                        <div class="key" data-key="i">I</div>
                        <div class="key" data-key="o">O</div>
                        <div class="key" data-key="p">P</div>
                        <div class="key" data-key="[">[</div>
                        <div class="key" data-key="]">]</div>
                        <div class="key key-wide-1-5" data-key="\">\</div>
                    </div>
                    <!-- Row 3 -->
                    <div class="keyboard-row">
                        <div class="key key-wide-1-75" data-key="CapsLock">Caps</div>
                        <div class="key home-key" data-key="a">A</div>
                        <div class="key" data-key="s">S</div>
                        <div class="key" data-key="d">D</div>
                        <div class="key home-key" data-key="f">F</div>
                        <div class="key" data-key="g">G</div>
                        <div class="key" data-key="h">H</div>
                        <div class="key home-key" data-key="j">J</div>
                        <div class="key" data-key="k">K</div>
                        <div class="key" data-key="l">L</div>
                        <div class="key home-key" data-key=";">;</div>
                        <div class="key" data-key="'">'</div>
                        <div class="key key-wide-2-25" data-key="Enter">Enter</div>
                    </div>
                    <!-- Row 4 -->
                    <div class="keyboard-row">
                        <div class="key key-wide-2-25" data-key="Shift">Shift</div>
                        <div class="key" data-key="z">Z</div>
                        <div class="key" data-key="x">X</div>
                        <div class="key" data-key="c">C</div>
                        <div class="key" data-key="v">V</div>
                        <div class="key" data-key="b">B</div>
                        <div class="key" data-key="n">N</div>
                        <div class="key" data-key="m">M</div>
                        <div class="key" data-key=",">,</div>
                        <div class="key" data-key=".">.</div>
                        <div class="key" data-key="/">/</div>
                        <div class="key key-wide-2-75" data-key="Shift">Shift</div>
                    </div>
                    <!-- Row 5 -->
                    <div class="keyboard-row">
                        <div class="key key-wide-1-25" data-key="Control">Ctrl</div>
                        <div class="key key-wide-1-25" data-key="Meta">
                            <i class="ph ph-command"></i>
                        </div>
                        <div class="key key-wide-1-25" data-key="Alt">Alt</div>
                        <div class="key key-space" data-key=" ">Space</div>
                        <div class="key key-wide-1-25" data-key="Alt">Alt</div>
                        <div class="key key-wide-1-25" data-key="Meta">
                            <i class="ph ph-command"></i>
                        </div>
                        <div class="key key-wide-1-25" data-key="ContextMenu">
                            <i class="ph ph-list"></i>
                        </div>
                        <div class="key key-wide-1-25" data-key="Control">Ctrl</div>
                    </div>
                </div>
            </div>

            <!-- Restart Button -->
            <button class="restart-btn" id="restartBtn" title="Restart test (Tab + Enter)">
                <i class="ph ph-arrow-clockwise"></i>
                <span>Restart</span>
            </button>

            <!-- Results Modal -->
            <div class="results-modal" id="resultsModal">
                <div class="results-content">
                    <h2 class="results-title">Results</h2>
                    <div class="results-stats">
                        <div class="result-stat result-main">
                            <span class="result-value" id="resultWpm">0</span>
                            <span class="result-label">wpm</span>
                        </div>
                        <div class="result-stat">
                            <span class="result-value" id="resultAccuracy">0</span>
                            <span class="result-label">% accuracy</span>
                        </div>
                        <div class="result-stat">
                            <span class="result-value" id="resultRaw">0</span>
                            <span class="result-label">raw wpm</span>
                        </div>
                        <div class="result-stat">
                            <span class="result-value" id="resultChars">0/0</span>
                            <span class="result-label">characters</span>
                        </div>
                        <div class="result-stat">
                            <span class="result-value" id="resultTime">0</span>
                            <span class="result-label">seconds</span>
                        </div>
                    </div>
                    <button class="results-restart-btn" id="resultsRestartBtn">
                        <i class="ph ph-arrow-clockwise"></i>
                        Try Again
                    </button>
                </div>
            </div>
        </div>

        <!-- Navigation Bar (loaded dynamically) -->
        <div id="navbar-container"></div>
    </main>

    <script src="components/components.js"></script>
    <script src="typing.js"></script>
</body>
</html>
