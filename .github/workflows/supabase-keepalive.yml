# Free-tier Supabase projects pause after 7 days without activity.
# A tiny read every 3 days keeps the visitors gallery and ask-jon backend awake.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *" # 09:17 UTC every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the visitors table
        # Same public URL + publishable key as supabase-config.js (RLS allows anon reads).
        env:
          SUPABASE_URL: https://ngpjycfwqhuxxngowwst.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_pVkU91A7qHypLI7BnePoIA_ViV_-3-H
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/visitors?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
