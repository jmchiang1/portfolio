<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors | Jonathan Chiang</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="motion.css">
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

    <style>
        body { opacity: 0; animation: jc-body-fade 0.4s ease 0.05s forwards; }
        @keyframes jc-body-fade { to { opacity: 1; } }

        /* ---- Layout (mirrors .motion-layout) ---- */
        .visitors-layout {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 200px 60px 80px;
        }

        /* ---- Centered hero (mirrors .motion-hero) ---- */
        .visitors-hero {
            margin: 0 auto 64px;
            text-align: center;
        }
        .visitors-hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            padding: 6px 14px;
            border-radius: 1000px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.65);
            opacity: 0;
            transform: translateY(20px);
            animation: visitors-hero-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        }
        .visitors-hero-eyebrow i { font-size: 13px; color: #66d2ff; }
        .visitors-hero-title {
            font-family: 'Gabarito', sans-serif;
            font-weight: 800;
            font-size: clamp(40px, 6vw, 60px);
            line-height: 1.05;
            letter-spacing: -0.03em;
            color: #fff;
            opacity: 0;
            transform: translateY(20px);
            animation: visitors-hero-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }
        .visitors-hero-title-accent {
            background: linear-gradient(135deg, #1180f9 0%, #66d2ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .visitors-hero-blurb {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            max-width: 560px;
            margin: 18px auto 0;
            opacity: 0;
            transform: translateY(20px);
            animation: visitors-hero-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }
        .visitors-hero-meta {
            margin-top: 22px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(20px);
            animation: visitors-hero-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        }
        @keyframes visitors-hero-up {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---- Gallery grid ---- */
        .visitors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .visitor-card {
            position: relative;
            padding: 22px 22px 20px;
            border-radius: 18px;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(120% 80% at 110% -10%, rgba(255, 255, 255, 0.06), transparent 55%),
                linear-gradient(150deg,
                    color-mix(in oklab, var(--vc-color, #1f1f24) 92%, white 8%) 0%,
                    var(--vc-color, #1f1f24) 55%,
                    color-mix(in oklab, var(--vc-color, #1f1f24) 80%, black 20%) 100%);
            border: 1px solid color-mix(in oklab, var(--vc-color, #1f1f24) 70%, white 30%);
            box-shadow:
                0 20px 50px -25px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            color: var(--vc-text, #fff);
            display: flex;
            flex-direction: column;
            gap: 14px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .visitor-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 30px 60px -25px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .visitor-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .visitor-card-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5px;
            font-weight: 500;
            color: var(--vc-text-dim, rgba(255,255,255,0.55));
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .visitor-card-serial {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--vc-text-dim, rgba(255,255,255,0.5));
            letter-spacing: 0.14em;
        }
        .visitor-card-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--vc-text, #fff);
        }
        .visitor-card-mini-kb {
            background: color-mix(in oklab, var(--vc-color, #1f1f24) 65%, black 35%);
            border: 1px solid color-mix(in oklab, var(--vc-color, #1f1f24) 50%, white 12%);
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .visitor-card-mini-kb .kb-row {
            display: flex;
            gap: 2px;
            height: 12px;
            align-items: stretch;
        }
        .visitor-card-mini-kb .kb-key {
            flex: 1 1 0;
            min-width: 0;
            background: var(--vc-keycap, #e7dcc2);
            border: 1px solid color-mix(in oklab, var(--vc-keycap, #e7dcc2) 80%, black 20%);
            border-radius: 1.5px;
        }
        .visitor-card-mini-kb .kb-key.kb-space { flex-grow: 6; }
        .visitor-card-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--vc-text-dim, rgba(255,255,255,0.6));
        }
        .visitor-card-meta b {
            display: block;
            font-weight: 500;
            color: var(--vc-text-dim, rgba(255,255,255,0.45));
            font-size: 9px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .visitor-card-meta span {
            font-weight: 600;
            color: var(--vc-text, #fff);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .visitor-card-foot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px dashed color-mix(in oklab, var(--vc-text-dim, rgba(255,255,255,0.4)) 60%, transparent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--vc-text-dim, rgba(255,255,255,0.55));
            letter-spacing: 0.08em;
        }

        .visitors-empty {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        .visitors-empty i { display: block; font-size: 32px; margin-bottom: 12px; opacity: 0.6; }
        .visitors-empty a { color: #66d2ff; text-decoration: none; border-bottom: 1px dashed rgba(102, 210, 255, 0.4); }
        .visitors-error { color: #ef4444; }

        /* ---- Typing-test CTA — floating bottom-left ---- */
        .visitors-typing-cta {
            position: fixed;
            bottom: 40px;
            left: 40px;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-radius: 1000px;
            background: rgba(17, 128, 249, 0.1);
            border: 1px solid rgba(17, 128, 249, 0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            color: #66d2ff;
            text-decoration: none;
            letter-spacing: 0.04em;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            opacity: 0;
            animation: visitors-cta-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }
        .visitors-typing-cta:hover {
            background: rgba(17, 128, 249, 0.18);
            border-color: rgba(17, 128, 249, 0.5);
            transform: translateY(-2px);
        }
        .visitors-typing-cta i { font-size: 16px; }
        @keyframes visitors-cta-in {
            to { opacity: 1; }
        }

        @media (max-width: 720px) {
            .visitors-layout { padding: 140px 22px 32px; }
            .visitors-hero { margin-bottom: 40px; }
            .visitors-grid { grid-template-columns: 1fr; gap: 14px; }
        }
    </style>
</head>
<body>
    <!-- Background Grid -->
    <div id="background-grid" class="grid-visible"></div>

    <!-- Pulsing radial glow -->
    <div class="glow"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="/" class="nav-logo">
            <img src="assets/logo.png" alt="JC" />
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">UX/UI</a>
            <a href="motion.html" class="nav-link">Motion</a>
            <a href="vibes.html" class="nav-link">Vibes</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="#" class="nav-link active">Visitors</a>
        </div>
        <button class="hamburger" aria-label="Menu">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </nav>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu">
        <a href="/" class="mobile-menu-link">UX/UI</a>
        <a href="motion.html" class="mobile-menu-link">Motion</a>
        <a href="vibes.html" class="mobile-menu-link">Vibes</a>
        <a href="about.html" class="mobile-menu-link">About</a>
        <a href="#" class="mobile-menu-link active">Visitors</a>
    </div>

    <!-- Visitors Content -->
    <main class="visitors-layout">
        <section class="visitors-hero">
            <h1 class="visitors-hero-title">
                Everyone who's <span class="visitors-hero-title-accent">stopped by.</span>
            </h1>
            <div class="visitors-hero-meta">
                <span id="visitorCount">— visitors</span>
            </div>
        </section>

        <section class="visitors-grid" id="visitorsGrid"></section>
    </main>

    <!-- Typing test CTA — bottom right, left of social links -->
    <a href="typing.html" class="visitors-typing-cta">
        <span>take the typing test</span>
    </a>

    <!-- Social links — bottom right -->
    <div class="social-links">
        <a href="https://www.linkedin.com/in/jmchiang5/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn" data-tooltip="LinkedIn">
            <i class="ph ph-linkedin-logo"></i>
        </a>
        <a href="https://github.com/jmchiang1" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub" data-tooltip="Github">
            <i class="ph ph-github-logo"></i>
        </a>
        <a href="assets/Jonathan-Chiang-Design-Resume-2026.pdf" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Resume" data-tooltip="Resume">
            <i class="ph ph-read-cv-logo"></i>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="transitions.js"></script>
    <script src="supabase-config.js"></script>
    <script>
        // ---- Shared nav: hamburger + page transitions ----
        (function () {
            var hamburger  = document.querySelector('.hamburger');
            var mobileMenu = document.querySelector('.mobile-menu');

            if (hamburger && mobileMenu) {
                function closeMenu() {
                    hamburger.classList.remove('is-open');
                    mobileMenu.classList.remove('is-open');
                    document.body.classList.remove('menu-open');
                }
                hamburger.addEventListener('click', function () {
                    var open = mobileMenu.classList.toggle('is-open');
                    hamburger.classList.toggle('is-open', open);
                    document.body.classList.toggle('menu-open', open);
                });
                mobileMenu.querySelectorAll('.mobile-menu-link').forEach(function (a) {
                    a.addEventListener('click', closeMenu);
                });
            }

            if (window.PageTransitions) PageTransitions.bindNavLinks();
        })();

        // ---- Visitor gallery ----
        (function () {
            'use strict';

            var CASES = {
                Graphite: { color: '#1f1f24', text: '#ffffff', dim: 'rgba(255,255,255,0.55)' },
                Midnight: { color: '#1a2747', text: '#ffffff', dim: 'rgba(255,255,255,0.6)'  },
                Ember:    { color: '#c0673f', text: '#1a0d05', dim: 'rgba(26,13,5,0.6)'      },
                Moss:     { color: '#3a5b3f', text: '#f4f1e3', dim: 'rgba(244,241,227,0.6)'  },
                Bone:     { color: '#e6dccb', text: '#1c1a14', dim: 'rgba(28,26,20,0.55)'    }
            };
            var KEYCAPS = {
                Cream:      '#e7dcc2',
                BoW:        '#13131a',
                Olivia:     '#e9dcd4',
                Botanical:  '#1c2a26',
                Dolch:      '#2a2a2e'
            };

            var grid = document.getElementById('visitorsGrid');
            var countEl = document.getElementById('visitorCount');

            // Persistent seed cards — always rendered alongside real visitors so
            // the gallery never feels empty. Each one uses a different combo of
            // case / switch / keycaps / layout so the wall reads as varied.
            var SEED_VISITORS = [
                { name: 'TACTILE LANTERN', layout: '75%',  case_color: 'Graphite', switch_type: 'Tactile', keycaps: 'Cream',     serial: 1038, created_at: '2026-04-12T17:24:00Z' },
                { name: 'CHERRY ATLAS',    layout: '60%',  case_color: 'Midnight', switch_type: 'Linear',  keycaps: 'BoW',       serial: 1041, created_at: '2026-04-21T09:11:00Z' },
                { name: 'INKY SAFFRON',    layout: 'TKL',  case_color: 'Ember',    switch_type: 'Clicky',  keycaps: 'Olivia',    serial: 1054, created_at: '2026-05-03T22:48:00Z' },
                { name: 'FROSTED CYPHER',  layout: '100%', case_color: 'Moss',     switch_type: 'Tactile', keycaps: 'Botanical', serial: 1062, created_at: '2026-05-11T14:02:00Z' },
                { name: 'HOLY MARIGOLD',   layout: '75%',  case_color: 'Bone',     switch_type: 'Linear',  keycaps: 'Dolch',     serial: 1071, created_at: '2026-05-18T08:35:00Z' }
            ];

            function miniKb() {
                var rows = [14, 14, 13, 12, null];
                return rows.map(function (count) {
                    var keys = '';
                    if (count === null) {
                        keys =
                            '<div class="kb-key"></div>'.repeat(3) +
                            '<div class="kb-key kb-space"></div>' +
                            '<div class="kb-key"></div>'.repeat(3);
                    } else {
                        keys = '<div class="kb-key"></div>'.repeat(count);
                    }
                    return '<div class="kb-row">' + keys + '</div>';
                }).join('');
            }

            function fmtDate(iso) {
                if (!iso) return '—';
                var d = new Date(iso);
                if (isNaN(d.valueOf())) return '—';
                return String(d.getMonth() + 1).padStart(2, '0') + '/' +
                       String(d.getDate()).padStart(2, '0') + '/' +
                       String(d.getFullYear()).slice(-2);
            }

            function renderCard(v) {
                var c = CASES[v.case_color] || CASES.Graphite;
                var keycap = KEYCAPS[v.keycaps] || KEYCAPS.Cream;
                return (
                    '<article class="visitor-card" style="--vc-color:' + c.color +
                    ';--vc-text:' + c.text + ';--vc-text-dim:' + c.dim +
                    ';--vc-keycap:' + keycap + '">' +
                        '<div class="visitor-card-head">' +
                            '<span class="visitor-card-tag">VISITOR BUILD</span>' +
                            '<span class="visitor-card-serial">NO. ' + String(v.serial || 0).padStart(4, '0') + '</span>' +
                        '</div>' +
                        '<h3 class="visitor-card-name">' + escapeHtml(v.name || '—') + '</h3>' +
                        '<div class="visitor-card-mini-kb">' + miniKb() + '</div>' +
                        '<div class="visitor-card-meta">' +
                            '<div><b>Layout</b><span>' + escapeHtml(v.layout || '—') + '</span></div>' +
                            '<div><b>Switch</b><span>' + escapeHtml(v.switch_type || '—') + '</span></div>' +
                            '<div><b>Case</b><span>' + escapeHtml(v.case_color || '—') + '</span></div>' +
                            '<div><b>Keycaps</b><span>' + escapeHtml(v.keycaps || '—') + '</span></div>' +
                        '</div>' +
                        '<div class="visitor-card-foot">' +
                            '<span>ISSUED ' + fmtDate(v.created_at || v.issued_at) + '</span>' +
                            '<span>x ' + escapeHtml(initials(v.name)) + '</span>' +
                        '</div>' +
                    '</article>'
                );
            }

            function escapeHtml(s) {
                return String(s == null ? '' : s)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function initials(name) {
                if (!name) return '__';
                return name.split(' ').map(function (w) { return w.charAt(0); }).join('');
            }

            function tryLocal() {
                try {
                    var raw = localStorage.getItem('jc_visitor');
                    if (!raw) return null;
                    var v = JSON.parse(raw);
                    v.created_at = v.issued_at;
                    return [v];
                } catch (e) { return null; }
            }

            // Real visitors render first (newest at top), seeds fill in behind
            // them so the gallery always shows at least the seed wall.
            function renderAll(realRows) {
                var all = (realRows || []).concat(SEED_VISITORS);
                grid.innerHTML = all.map(renderCard).join('');
                var n = all.length;
                countEl.textContent = n + ' visitor' + (n === 1 ? '' : 's');
            }

            function load() {
                var url = window.SUPABASE_URL;
                var key = window.SUPABASE_ANON_KEY;
                if (!url || !key || typeof window.supabase === 'undefined') {
                    renderAll(tryLocal() || []);
                    return;
                }

                var client = window.supabase.createClient(url, key);
                client.from('visitors')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(200)
                    .then(function (res) {
                        if (res.error) throw res.error;
                        renderAll(res.data || []);
                    })
                    .catch(function (err) {
                        console.warn('[visitors] load failed', err);
                        // Backend hiccup — still show seeds so the page isn't blank.
                        renderAll([]);
                    });
            }

            load();
        })();
    </script>
</body>
</html>
