<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome · Jonathan Chiang</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

    <style>body { opacity: 0; }</style>
</head>
<body class="is-splashing">
    <!-- First-visit splash: the JC monogram assembles square-by-square,
         glows in accent cyan, presses like a keycap, then the curtain
         lifts to reveal the builder. Driven by welcome-splash.js. -->
    <div id="welcomeSplash" class="welcome-splash" aria-hidden="true">
        <div class="splash-mark">
            <svg class="splash-svg" viewBox="0 0 94 70" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JC">
                <!-- Row 0 — top bar -->
                <rect class="splash-cell" x="12" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="24" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="36" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="48" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="60" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="72" y="0"  width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="84" y="0"  width="10" height="10" rx="2"/>
                <!-- Rows 1–3 — stems -->
                <rect class="splash-cell" x="36" y="12" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="60" y="12" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="36" y="24" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="60" y="24" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="36" y="36" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="60" y="36" width="10" height="10" rx="2"/>
                <!-- Row 4 — stems + isolated cell -->
                <rect class="splash-cell" x="0"  y="48" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="36" y="48" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="60" y="48" width="10" height="10" rx="2"/>
                <!-- Row 5 — J foot + C bottom -->
                <rect class="splash-cell" x="12" y="60" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="24" y="60" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="72" y="60" width="10" height="10" rx="2"/>
                <rect class="splash-cell" x="84" y="60" width="10" height="10" rx="2"/>
            </svg>
        </div>
    </div>

    <div id="background-grid" class="grid-visible"></div>
    <!-- Interactive mesh grid (welcome only). Renders the same line grid as
         #background-grid but on a canvas, so points can be "pulled" toward the
         cursor. The CSS grid above stays as the static / reduced-motion fallback
         and is hidden by welcome-grid.js once the canvas takes over. -->
    <canvas id="welcomeGrid" class="welcome-grid-canvas" aria-hidden="true"></canvas>
    <div class="glow"></div>

    <!-- Kept outside .welcome-layout: the layout is no longer transformed on
         exit, but a fixed element must never live under a transformed ancestor
         (that ancestor would become its containing block and snap it sideways). -->
    <a href="/" class="welcome-skip" id="welcomeSkip" aria-label="Skip to portfolio">
        <span>Skip to Portfolio</span>
        <i class="ph ph-arrow-right"></i>
    </a>

    <main class="welcome-layout">
        <header class="welcome-hero">
            <h1 class="welcome-title">
                Welcome to Jonathan's Portfolio,</span>
            </h1>
            <h1 class="welcome-title welcome-title-sub">
                Build your <span class="welcome-title-accent">keyboard to begin!</span>
            </h1>
        </header>

        <section class="welcome-stage">
            <!-- The Build Card -->
            <article class="build-card" id="buildCard">
                <header class="build-card-head">
                    <div class="build-card-brand">
                        <h2 class="build-card-name" id="cardName">YOUR NAME</h2>
                    </div>
                    <span class="build-card-serial" id="cardSerial">NO. 0000</span>
                </header>


                <div class="build-card-keyboard" id="cardKeyboard" aria-hidden="true">
                    <!-- rendered by welcome.js -->
                </div>

                <dl class="build-card-spec">
                    <div class="build-card-spec-row">
                        <dt>LAYOUT</dt>
                        <dd id="specLayout">60%</dd>
                    </div>
                    <div class="build-card-spec-row">
                        <dt>CASE</dt>
                        <dd>
                            <span class="build-card-swatch" id="specCaseSwatch" aria-hidden="true"></span>
                            <span id="specCase">White</span>
                        </dd>
                    </div>
                    <div class="build-card-spec-row">
                        <dt>SWITCH</dt>
                        <dd>
                            <i class="ph ph-circle-half" id="specSwitchIcon" aria-hidden="true"></i>
                            <span id="specSwitch">Tactile</span>
                        </dd>
                    </div>
                    <div class="build-card-spec-row">
                        <dt>KEYCAPS</dt>
                        <dd>
                            <span class="build-card-swatch" id="specKeycapSwatch" aria-hidden="true"></span>
                            <span id="specKeycap">Black</span>
                        </dd>
                    </div>
                </dl>

                <footer class="build-card-foot">
                    <div class="build-card-foot-col">
                        <span class="build-card-foot-label">ISSUED</span>
                        <span class="build-card-foot-value" id="cardDate">--/--/--</span>
                    </div>
                    <div class="build-card-foot-col build-card-sig">
                        <span class="build-card-foot-label">SIGNATURE</span>
                        <span class="build-card-foot-value build-card-foot-sig" id="cardSignature">x ___________</span>
                    </div>
                </footer>
            </article>

            <!-- Right-side panel: name + controls + CTA -->
            <aside class="welcome-panel">
                <div class="build-controls">
                    <div class="welcome-name-row">
                        <label class="welcome-name-label" for="visitorName">visitor</label>
                        <div class="welcome-name-input-wrap">
                            <input
                                type="text"
                                id="visitorName"
                                class="welcome-name-input"
                                autocomplete="off"
                                autocorrect="off"
                                autocapitalize="characters"
                                spellcheck="false"
                                maxlength="24"
                                placeholder="LOADING…">
                            <button class="welcome-reroll" id="rerollName" type="button" aria-label="Roll a new name">
                                <i class="ph ph-shuffle"></i>
                            </button>
                        </div>
                    </div>

                    <div class="build-control">
                        <span class="build-control-label">layout</span>
                        <div class="build-control-row">
                            <button class="layout-btn active" data-layout="60" type="button"><span class="layout-btn-name">60</span><span class="layout-btn-pct">%</span></button>
                            <button class="layout-btn" data-layout="75" type="button"><span class="layout-btn-name">75</span><span class="layout-btn-pct">%</span></button>
                            <button class="layout-btn" data-layout="tkl" type="button"><span class="layout-btn-name">TKL</span></button>
                        </div>
                    </div>

                    <div class="build-control">
                        <span class="build-control-label">case</span>
                        <div class="build-control-row build-swatches">
                            <button class="swatch-btn active" data-case="white" data-name="White" style="--swatch:#f4f4f6" type="button" aria-label="White"></button>
                            <button class="swatch-btn" data-case="charcoal" data-name="Charcoal Grey" style="--swatch:#36383d" type="button" aria-label="Charcoal Grey"></button>
                            <button class="swatch-btn" data-case="navy" data-name="Navy Blue" style="--swatch:#1c2c54" type="button" aria-label="Navy Blue"></button>
                            <button class="swatch-btn" data-case="crimson" data-name="Crimson Red" style="--swatch:#9c1f2e" type="button" aria-label="Crimson Red"></button>
                            <button class="swatch-btn" data-case="matcha" data-name="Matcha Green" style="--swatch:#93a564" type="button" aria-label="Matcha Green"></button>
                        </div>
                    </div>

                    <div class="build-control">
                        <span class="build-control-label">switch</span>
                        <div class="build-control-row">
                            <button class="switch-btn active" data-switch="tactile" data-name="Tactile" type="button">
                                <i class="ph ph-circle-half"></i>
                                <span>tactile</span>
                            </button>
                            <button class="switch-btn" data-switch="linear" data-name="Linear" type="button">
                                <i class="ph ph-line-segment"></i>
                                <span>linear</span>
                            </button>
                            <button class="switch-btn" data-switch="clicky" data-name="Clicky" type="button">
                                <i class="ph ph-wave-sine"></i>
                                <span>clicky</span>
                            </button>
                        </div>
                    </div>

                    <div class="build-control">
                        <span class="build-control-label">keycaps</span>
                        <div class="build-control-row build-swatches">
                            <button class="swatch-btn active" data-keycap="black" data-name="Black" style="--swatch:#16161d; --legend:#f3f3f3" type="button" aria-label="Black"></button>
                            <button class="swatch-btn" data-keycap="white" data-name="White" style="--swatch:#f4f4f6; --legend:#1d1a14" type="button" aria-label="White"></button>
                            <button class="swatch-btn" data-keycap="violet" data-name="Violet" style="--swatch:#7c5cf2; --legend:#ffffff" type="button" aria-label="Violet"></button>
                            <button class="swatch-btn" data-keycap="yellow" data-name="Electric Yellow" style="--swatch:#f4e21f; --legend:#1a1a10" type="button" aria-label="Electric Yellow"></button>
                            <button class="swatch-btn" data-keycap="cream" data-name="Cream" style="--swatch:#e7dcc2; --legend:#1d1a14" type="button" aria-label="Cream"></button>
                        </div>
                    </div>
                </div>

                <div class="welcome-cta">
                    <button class="welcome-submit" id="welcomeSubmit" type="button">
                        <span>Save Keyboard</span>
                        <i class="ph ph-arrow-right"></i>
                    </button>
                </div>
            </aside>
        </section>

        <!-- <footer class="welcome-foot">
            <span class="welcome-foot-time" id="footTime">--:--:--</span>
            <span class="welcome-foot-status">
                <span class="welcome-foot-dot"></span>
                ALL SYSTEMS OPERATIONAL
            </span>
        </footer> -->
    </main>

    <!-- Supabase (gracefully degrades if config missing) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="welcome-splash.js"></script>
    <script src="transitions.js"></script>
    <script src="supabase-config.js"></script>
    <script src="welcome-grid.js"></script>
    <!-- Shared keyboard layouts + renderer — must load BEFORE welcome.js
         and BEFORE visitors.html's renderer (loaded there separately). -->
    <script src="keyboard-layouts.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
